name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Syntax check
        run: find wp-content/plugins/iranian-league-table tests bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs

  i18n:
    name: Translations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php bin/i18n.php

  block-build:
    name: Block build is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed build/ matches src/
        run: git diff --exit-code -- wp-content/plugins/iranian-league-table/build

  integration:
    name: Integration tests (WordPress + multisite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run env:start
      - run: npm run test:integration
      - run: npm run test:integration:multisite
