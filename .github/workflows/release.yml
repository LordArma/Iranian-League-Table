name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/^[ *]*Version:[[:space:]]*//p' wp-content/plugins/iranian-league-table/iranianleaguetable.php | tr -d '\r')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != plugin version $version"; exit 1; }
      - name: Build zip
        run: bin/build-zip.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
